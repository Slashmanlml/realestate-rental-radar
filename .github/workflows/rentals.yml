name: Real Estate Rental Radar Autonomous Scanner

on:
  schedule:
    - cron: '*/30 11-23 * * *' # Cada 30 minutos de 8hs a 20hs
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  scan-rentals:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Ejecutar Radar Inmobiliario
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node index.js

      - name: 4. Auto-Commit de Base Histórica
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/propiedades_vistas.json
          git diff --staged --quiet || (git commit -m "chore(data): actualizar base historica de propiedades analizadas [skip ci]" && git push)
